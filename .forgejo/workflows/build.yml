name: Build

# Build the contacts image on the Forgejo runner.
# Also called by the sync workflow after upstream changes are merged into contacts.
on:
  push:
    branches:
      - contacts
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Forgejo is reached over https with a certificate from the private LUKLU CA,
      # trust its root before anything talks to the server.
      # LUKLU Root CA, SHA-256 4E:66:08:58:2F:F0:7C:7A:EA:E0:85:43:57:90:8B:70:DC:28:42:19:FB:DE:8C:1A:13:0E:58:FB:EC:33:8E:F6
      - name: Trust LUKLU root CA
        run: |
          cat > /usr/local/share/ca-certificates/luklu-root-ca.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIBkzCCATmgAwIBAgIQS/abd0bLCdBZV8DH72QVFTAKBggqhkjOPQQDAjAoMQ4w
          DAYDVQQKEwVMVUtMVTEWMBQGA1UEAxMNTFVLTFUgUm9vdCBDQTAeFw0yNjA1MDEy
          MDIwMzFaFw0zNjA0MjgyMDIwMzFaMCgxDjAMBgNVBAoTBUxVS0xVMRYwFAYDVQQD
          Ew1MVUtMVSBSb290IENBMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1sLOGWBh
          cG/yXRwa0F1KX99UOBfvoN2cv/KLW9WcJWh0tjQJcONDMxeJaOVwN6dGNXeFTy0u
          CU+yxzQRTA4PcKNFMEMwDgYDVR0PAQH/BAQDAgEGMBIGA1UdEwEB/wQIMAYBAf8C
          AQEwHQYDVR0OBBYEFNCASUWBmklefUK2sjYI60RmXj7oMAoGCCqGSM49BAMCA0gA
          MEUCIA5+p1RX3m11LkFRO3x5z9IqIcl2D3350BcdkHK92YNvAiEAkoIMDQyxaQmP
          a3Tyq8m6HI5ndMVEldNSonQ2S7XCBlA=
          -----END CERTIFICATE-----
          PEM
          update-ca-certificates > /dev/null
          echo "NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/luklu-root-ca.crt" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: contacts
          fetch-depth: 0 # tags are needed for the image version

      - name: Image tags
        id: meta
        run: |
          version="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          sha="$(git rev-parse --short HEAD)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Building voidauth ${version} + contacts (${sha})"

      - name: Build image
        run: |
          docker build \
            --build-arg SERVE_IMAGE=node:24-alpine3.22 \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            -t voidauth:contacts \
            -t "voidauth:${{ steps.meta.outputs.version }}-contacts-${{ steps.meta.outputs.sha }}" \
            .

      # Publishing needs a REGISTRY_TOKEN secret (token with package write access)
      # and a runner host that can reach the registry over https.
      - name: Publish image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
          SERVER_URL: ${{ forgejo.server_url }}
          OWNER: ${{ forgejo.repository_owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "REGISTRY_TOKEN secret is not set, the image is only kept on the runner host."
            exit 0
          fi
          # The registry is named after the Forgejo ROOT_URL host, which can differ from the address the
          # runner uses (SERVER_URL). Take it from the token realm Forgejo advertises, unless REGISTRY is set.
          registry="$REGISTRY"
          if [ -z "$registry" ]; then
            realm="$(curl -sS -o /dev/null -D - "${SERVER_URL}/v2/" | sed -n 's/.*realm="\([^"]*\)".*/\1/Ip')"
            registry="$(echo "$realm" | sed -E 's#^https?://##; s#/.*##')"
          fi
          if [ -z "$registry" ]; then
            echo "::error::Could not detect the container registry, set the REGISTRY repository variable."
            exit 1
          fi
          echo "Publishing to registry ${registry}"
          image="${registry}/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/voidauth"
          echo "$REGISTRY_TOKEN" | docker login "$registry" -u "$OWNER" --password-stdin
          for tag in contacts "${VERSION}-contacts-${SHA}"; do
            docker tag "voidauth:${VERSION}-contacts-${SHA}" "${image}:${tag}"
            docker push "${image}:${tag}"
          done
