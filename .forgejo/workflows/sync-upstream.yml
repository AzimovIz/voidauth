name: Sync upstream

# Keep main equal to upstream voidauth main, then merge it into contacts and build.
# Scheduled workflows run from the default branch, which must be contacts.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  UPSTREAM_URL: https://github.com/voidauth/voidauth.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # Forgejo is reached over https with a certificate from the private LUKLU CA,
      # trust its root before anything talks to the server.
      # LUKLU Root CA, SHA-256 4E:66:08:58:2F:F0:7C:7A:EA:E0:85:43:57:90:8B:70:DC:28:42:19:FB:DE:8C:1A:13:0E:58:FB:EC:33:8E:F6
      - name: Trust LUKLU root CA
        run: |
          cat > /usr/local/share/ca-certificates/luklu-root-ca.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIBkzCCATmgAwIBAgIQS/abd0bLCdBZV8DH72QVFTAKBggqhkjOPQQDAjAoMQ4w
          DAYDVQQKEwVMVUtMVTEWMBQGA1UEAxMNTFVLTFUgUm9vdCBDQTAeFw0yNjA1MDEy
          MDIwMzFaFw0zNjA0MjgyMDIwMzFaMCgxDjAMBgNVBAoTBUxVS0xVMRYwFAYDVQQD
          Ew1MVUtMVSBSb290IENBMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE1sLOGWBh
          cG/yXRwa0F1KX99UOBfvoN2cv/KLW9WcJWh0tjQJcONDMxeJaOVwN6dGNXeFTy0u
          CU+yxzQRTA4PcKNFMEMwDgYDVR0PAQH/BAQDAgEGMBIGA1UdEwEB/wQIMAYBAf8C
          AQEwHQYDVR0OBBYEFNCASUWBmklefUK2sjYI60RmXj7oMAoGCCqGSM49BAMCA0gA
          MEUCIA5+p1RX3m11LkFRO3x5z9IqIcl2D3350BcdkHK92YNvAiEAkoIMDQyxaQmP
          a3Tyq8m6HI5ndMVEldNSonQ2S7XCBlA=
          -----END CERTIFICATE-----
          PEM
          update-ca-certificates > /dev/null
          echo "NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/luklu-root-ca.crt" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: contacts
          fetch-depth: 0
          # the automatic token is used to push, unless a SYNC_TOKEN secret with write access is set
          token: ${{ secrets.SYNC_TOKEN || forgejo.token }}

      - name: Update main from upstream
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch --tags upstream main
          git fetch origin main || true

          # main must only contain upstream commits, so it is always a fast-forward
          if git rev-parse --verify -q origin/main >/dev/null \
            && ! git merge-base --is-ancestor origin/main upstream/main; then
            echo "::error::main has commits that are not in upstream, refusing to overwrite it."
            exit 1
          fi

          git push origin upstream/main:refs/heads/main
          git push origin --tags

      - name: Merge main into contacts
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "contacts already contains upstream main."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Forgejo Actions"
          git config user.email "actions@noreply.localhost"
          if ! git merge --no-edit -m "Merge upstream main into contacts" upstream/main; then
            git merge --abort
            echo "::error::Merge conflict between upstream main and contacts, merge it manually."
            exit 1
          fi

          git push origin HEAD:refs/heads/contacts
          echo "merged=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.merged == 'true'
    uses: ./.forgejo/workflows/build.yml
    secrets: inherit
